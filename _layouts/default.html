<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  {% if page.description %}
    <meta name="description" content="{{ page.description }}">
  {% else %}
    <meta name="description" content="{{ site.description }}">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.page_css %}
    <link rel="stylesheet" href="{{ '/assets/css/' | append: page.page_css | append: '.css' | relative_url }}">
  {% endif %}
  <link rel="icon" type="image/png" href="/assets/photos/website-favicon.png">
  <link rel="apple-touch-icon" href="/assets/photos/website-favicon.png">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  {% include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.page_js %}
    <script src="{{ '/assets/js/' | append: page.page_js | append: '.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
